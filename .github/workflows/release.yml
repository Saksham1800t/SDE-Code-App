name: Release

# Pushing a tag like v1.2.3 builds SDE Code for Windows and macOS and publishes both
# installers as assets on a GitHub Release for that tag — the website's download button
# (apps/website/src/lib/releases.ts) reads that release's assets at its own build time, so a
# new tag is the only step needed to make a new build downloadable.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # @sde-code/sdk's package.json points "main"/"types" at dist/ (not src/), so its compiled
      # output has to exist before anything that imports it — protocol, then desktop — can
      # resolve its types. dist/ is correctly gitignored, so this has to be a real build step,
      # not something already sitting in the checkout.
      - run: pnpm --filter @sde-code/sdk build

      - run: pnpm --filter @sde-code/desktop exec tsc
      - run: pnpm --filter @sde-code/desktop exec vite build

      # No --win/--mac flag needed: electron-builder defaults to building whatever
      # platform it's currently running on, which is exactly what this matrix wants.
      # --publish always uploads the built installer straight to the GitHub Release
      # matching this tag (created automatically if it doesn't exist yet).
      - name: Build and publish installer
        working-directory: apps/desktop
        run: pnpm exec electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # There's no code-signing certificate for either platform yet. Without this,
          # electron-builder tries to auto-discover a signing identity/tooling on both
          # platforms — on Windows that's exactly what caused a symlink-privilege failure
          # fetching its signing-tool cache (winCodeSign) during local testing earlier this
          # session, unrelated to whether --win or --mac is actually being built.
          CSC_IDENTITY_AUTO_DISCOVERY: false
